{% extends "base.html" %}
{% block content %}
<h2>Сменить пароль для пользователя {{ user.username }}</h2>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Новый пароль</label>
        <input type="password" name="new_password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ url_for('main.user_list') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
