{% extends "base.html" %}
{% block content %}
<h2>Редактировать устройство: {{ device.name }}</h2>
<form method="POST">
    <div class="mb-3">
        <label>Имя</label>
        <input type="text" name="name" class="form-control" value="{{ device.name }}" required>
    </div>
    <div class="mb-3">
        <label>IP</label>
        <input type="text" name="ip" class="form-control" value="{{ device.ip }}" required>
    </div>
    <div class="mb-3">
        <label>Логин</label>
        <input type="text" name="username" class="form-control" value="{{ device.username }}" required>
    </div>
    <div class="mb-3">
        <label>Пароль</label>
        <input type="password" name="password" class="form-control" value="{{ device.password }}" required>
    </div>
    <div class="mb-3">
        <label>Enable пароль</label>
        <input type="password" name="enable_password" class="form-control" value="{{ device.enable_password }}">
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
