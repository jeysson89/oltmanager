<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLT Manager</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">OLT Manager</a>
            <div class="navbar-nav ms-auto">
                {% if current_user.is_authenticated %}
                    {% if current_user.is_admin %}
                    <a class="nav-link" href="{{ url_for('main.clients') }}">Клиенты</a>
                    <a class="nav-link" href="{{ url_for('main.monitoring') }}">Мониторинг</a>
                    <a class="nav-link" href="{{ url_for('main.login_history') }}"><i class="fas fa-history"></i> История</a>
                    <a class="nav-link" href="{{ url_for('main.user_list') }}">Пользователи</a>
                    <a class="nav-link" href="{{ url_for('main.settings') }}">Настройки</a>
                    <a class="nav-link text-warning" href="{{ url_for('main.restart') }}" onclick="return confirm('Перезагрузить сервер?')">⟳ Перезагрузка</a>
                    {% endif %}
                    <a class="nav-link" href="{{ url_for('main.logout') }}">Выйти</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
