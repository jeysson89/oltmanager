{% extends "base.html" %}
{% block content %}
<h2>Управление пользователями</h2>
<a href="{{ url_for('main.add_user') }}" class="btn btn-success mb-3">Добавить пользователя</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Имя пользователя</th>
            <th>Администратор</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ 'Да' if user.is_admin else 'Нет' }}</td>
            <td>
                <a href="{{ url_for('main.change_password', user_id=user.id) }}" class="btn btn-sm btn-warning">Сменить пароль</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
